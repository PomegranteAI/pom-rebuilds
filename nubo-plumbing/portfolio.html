<body data-page="portfolio">

<section class="page-hero">
  <div class="bg"><img src="img/job-marble-shower.jpg" alt=""></div>

    <span class="eyebrow">Our work</span>

</section>

<section class="tint">
  <div class="wrap">
    <div class="filters" role="group" aria-label="Filter projects">
      <button class="on" data-f="all">All projects</button>
      <button data-f="bath">Bathrooms</button>
      <button data-f="shower">Shower rooms</button>
    </div>
    <!-- CONFIRM: project titles and towns. Captions describe what is in each photo only. -->
    <div class="pf-grid">
      <figure class="pf reveal" data-cat="bath"><div class="pi"><img src="img/job-freestanding-bath.jpg" alt="Bathroom with freestanding bath, wood vanity and walk-in shower" loading="lazy"></div><figcaption class="pf-body"><b>Freestanding bath suite</b><span>Freestanding bath, walk-in shower, wood vanity</span></figcaption></figure>
      <figure class="pf reveal" data-cat="shower"><div class="pi"><img src="img/job-marble-shower.jpg" alt="Marble-effect shower room with brushed gold fittings" loading="lazy"></div><figcaption class="pf-body"><b>Marble and brushed gold</b><span>Walk-in shower, floating vanity, LED mirror</span></figcaption></figure>
      <figure class="pf reveal" data-cat="bath"><div class="pi"><img src="img/job-green-tiles.jpg" alt="Long bathroom with green tiles and patterned floor" loading="lazy"></div><figcaption class="pf-body"><b>Green feature wall</b><span>Patterned floor tiles, bath with shower screen</span></figcaption></figure>
      <figure class="pf reveal" data-cat="bath"><div class="pi"><img src="img/job-panelled-bath.jpg" alt="Bathroom with wood slat panelling and round LED mirror" loading="lazy"></div><figcaption class="pf-body"><b>Wood slat panelling</b><span>Round LED mirror, oak vanity, bath and shower</span></figcaption></figure>
      <figure class="pf reveal" data-cat="shower"><div class="pi"><img src="img/job-storage-niche.jpg" alt="Shower room with lit storage niche" loading="lazy"></div><figcaption class="pf-body"><b>Lit storage niche</b><span>Built-in shelving with LED strip lighting</span></figcaption></figure>
      <figure class="pf reveal" data-cat="bath"><div class="pi"><img src="img/job-terrazzo.jpg" alt="Bathroom with terrazzo floor and black vanity unit" loading="lazy"></div><figcaption class="pf-body"><b>Terrazzo and black</b><span>Terrazzo floor, black vanity, bath with screen</span></figcaption></figure>
    </div>
  </div>
</section>

<section class="dark">
  <div class="wrap" style="text-align:center">
    <span class="eyebrow">Your bathroom next?</span>

    <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
      <a href="contact.html" class="btn btn-cyan">Start my quote <i data-i="arrow"></i></a>
      <a data-tel class="btn btn-ghost"><i data-i="phone"></i> <span data-phone></span></a>
    </div>
  </div>
